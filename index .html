<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Jeniesys</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; background: #f9d9e7; color:#4a2934; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { background: #fff; padding:24px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.08); max-width:720px; width:100%; text-align:center }
    img { max-width:45%; height:auto; margin:8px }
    .music-note { color:#98717b; margin-top:12px }
  </style>
</head>
<body>
  <div class="card">
    <h1>For Jeniesys</h1>
    <div>
      <img src="./photo1.jpg" alt="photo1">
      <img src="./photo2.jpg" alt="photo2">
    </div>

    <h2>Now Playing</h2>

    <!-- Use the two URLs you provided as audio sources. Note: these URLs are page/search links (not direct .mp3 files) so playback may fail if the host doesn't serve raw audio files. -->
    <audio id="mainAudio" controls>
      <source src="https://pointswitbank.co.za/search/you-re-still-the-one" type="audio/mpeg">
      <source src="https://pointswitbank.co.za/search/ikaw-lang-ang-aking-mahal" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <div class="music-note" id="musicNote">Tap Play to play the music. If it doesn't play, the provided URLs may not point to direct audio files.</div>
  </div>

  <script>
    (function(){
      const audio = document.getElementById('mainAudio');
      const musicNote = document.getElementById('musicNote');

      audio.addEventListener('error', function(){
        console.error('Audio error', audio.error);
        musicNote.textContent = 'Audio could not be loaded. The URLs you gave might not be direct .mp3 files. Provide a direct MP3 URL or upload the files to the repo.';
      });

      // Modern browsers block autoplay; require user gesture. Help user by focusing the player.
      window.addEventListener('load', () => {
        // attempt to enable user to press space to toggle play/pause
        document.body.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            if (audio.paused) audio.play().catch(()=>{}); else audio.pause();
          }
        });
      });
    })();
  </script>
</body>
</html>
